[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student_risk"
version = "0.1.0"
description = "Early-warning classifier that flags students at risk of failing (UCI Student Performance)."
authors = [
    { name = "Mohamed Reda Zarrouk" },
    { name = "Georgy Salameh" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "joblib==1.5.2",
    "PyYAML==6.0.3",
    "ucimlrepo==0.0.7",
    # Test and lint tools are regular dependencies on purpose: the graders run
    # "pip install -e ." then "pytest" in a fresh environment, with no extra.
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[project.optional-dependencies]
# Only needed to run notebooks/analysis.ipynb and draw the figures:
# pip install -e ".[notebook]"
notebook = [
    "jupyter==1.1.1",
    "nbconvert==7.17.2",
    "ipykernel==7.3.0",
    "matplotlib==3.10.9",
]

[project.scripts]
student-risk = "student_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Code snippets in the Markdown explanations are copied from the source with their original
# indentation; the formatter must not rewrite them.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D"]
# N803/N806 forbid capital letters in argument/variable names. We keep the
# scikit-learn convention of a capital X for a feature matrix.
ignore = ["N803", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
